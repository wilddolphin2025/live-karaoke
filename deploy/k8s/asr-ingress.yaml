# Route the API through Traefik: per-request load balancing across ready pods,
# plus retries when a pod connection fails (e.g. pod restarting mid-rollout).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: asr-retry}
spec:
  retry: {attempts: 2, initialInterval: 200ms}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: parakeet-asr
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: default-asr-retry@kubernetescrd
spec:
  tls: [{secretName: slim-tls}]
  rules:
    - http:
        paths:
          - {path: /v1, pathType: Prefix, backend: {service: {name: parakeet-asr, port: {number: 80}}}}
          - {path: /docs, pathType: Prefix, backend: {service: {name: parakeet-asr, port: {number: 80}}}}
          - {path: /openapi.json, pathType: Exact, backend: {service: {name: parakeet-asr, port: {number: 80}}}}
