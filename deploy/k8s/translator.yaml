# On-demand private translator: llama.cpp server running google/translategemma-4b-it (Q4_K_M GGUF).
# 0 replicas by default; the ASR pods scale it to 1 (and themselves to 1) when a request asks for
# translation, which frees the second time-sliced GPU slot. VRAM is capped by --n-gpu-layers
# (remaining layers on CPU) and a small --ctx-size: 18 of 34 layers -> ~1.75 GB next to one ASR
# pod (~1.66 GB) on the 4 GB GPU. The ASR client sends a raw /completion prompt in the model's own
# chat-template format (asr/translate.py), so no --jinja is needed.
apiVersion: apps/v1
kind: Deployment
metadata: {name: translator}
spec:
  replicas: 0
  strategy: {type: Recreate}
  selector: {matchLabels: {app: translator}}
  template:
    metadata: {labels: {app: translator}}
    spec:
      runtimeClassName: nvidia
      terminationGracePeriodSeconds: 10
      initContainers:
        - name: fetch-model   # one-time 2.5 GB download into the shared HF cache
          image: curlimages/curl:8.10.1
          imagePullPolicy: IfNotPresent
          securityContext: {runAsUser: 1000, runAsGroup: 1000}
          command: [sh, -c, 'test -s /models/gguf/$(GGUF) || (mkdir -p /models/gguf && curl -fL -o /models/gguf/$(GGUF).part $(GGUF_URL) && mv /models/gguf/$(GGUF).part /models/gguf/$(GGUF))']
          env:
            - {name: GGUF, value: translategemma-4b-it.Q4_K_M.gguf}
            - {name: GGUF_URL, value: "https://huggingface.co/mradermacher/translategemma-4b-it-GGUF/resolve/main/translategemma-4b-it.Q4_K_M.gguf"}
          volumeMounts: [{name: models, mountPath: /models}]
      containers:
        - name: llama
          # Pinned by digest (deploy.sh pre-pulls it and marks it pinned in containerd so image GC keeps it).
          image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:4ccae195bf542f7844301ae06891baa32a7551cb16de8428af6e929403d4292c
          imagePullPolicy: IfNotPresent
          args:
            - --model
            - "/models/gguf/translategemma-4b-it.Q4_K_M.gguf"
            - --alias
            - "translategemma-4b-it"
            - --host
            - "0.0.0.0"
            - --port
            - "8080"
            - --n-gpu-layers
            - "$(N_GPU_LAYERS)"
            - --ctx-size
            - "2048"
            - --parallel
            - "1"
            - --threads
            - "8"
          env:
            - {name: N_GPU_LAYERS, value: "18"}
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: "2", memory: 4Gi}
            limits: {memory: 6Gi, nvidia.com/gpu: 1}
          startupProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 3
            failureThreshold: 100
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 15
            failureThreshold: 4
          volumeMounts: [{name: models, mountPath: /models, readOnly: false}]
      volumes:
        - name: models
          hostPath: {path: /home/ykiryanov/.cache/huggingface, type: Directory}
---
apiVersion: v1
kind: Service
metadata: {name: translator}
spec:
  selector: {app: translator}
  ports: [{port: 8080, targetPort: 8080}]
