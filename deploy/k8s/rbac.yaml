# Lets the ASR pods switch between "asr" mode (2 ASR pods) and "translate" mode
# (1 ASR pod + riva-translate). Namespace-scoped, only what the switch needs.
apiVersion: v1
kind: ServiceAccount
metadata: {name: parakeet-asr}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: parakeet-mode-switch}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [parakeet-asr, riva-translate]
    verbs: [get, patch]            # read replicas/readiness; last-used annotation
  - apiGroups: [apps]
    resources: [deployments/scale]
    resourceNames: [parakeet-asr, riva-translate]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [patch]                 # pod-deletion-cost on the pod serving the request
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: parakeet-mode-switch}
subjects: [{kind: ServiceAccount, name: parakeet-asr}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: parakeet-mode-switch}
