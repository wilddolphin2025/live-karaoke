<!doctype html>
<html><head><meta charset="utf-8"><title>Parakeet ASR</title><link rel="stylesheet" href="app.css"></head>
<body>
<header>
  <label class="grow">Server <input id="server" type="url" spellcheck="false"></label>
  <label>Language <select id="lang"></select></label>
  <button id="pin" title="Open in side panel (stays open)">📌</button>
</header>
<div class="trrow"><label><input id="tr" type="checkbox"> Translate to</label> <select id="trlang"></select>
  <small id="trnote">private, on this server: slower, lower quality</small></div>
<label id="drop" tabindex="0">
  <input id="file" type="file" accept=".wav,.mp3,.flac,.ogg,.m4a,.webm,.mp4,.mov,.mkv,audio/*,video/*" hidden>
  <div><strong>Drop audio or video here</strong> or click to choose<br><small>wav · mp3 · flac · ogg · m4a · webm · mp4 · mov · mkv</small></div>
</label>
<div id="status"></div>
<div id="error" hidden></div>
<audio id="player" controls hidden></audio>
<video id="vplayer" controls playsinline hidden></video>
<div id="meta"></div>
<div id="panes">
  <div id="out"></div>
  <section id="trpane" hidden><div id="trstatus"></div><div id="trout"></div></section>
</div>
<div class="row"><button id="copy" disabled>Copy</button><button id="dl" disabled>Download .txt</button></div>
<footer id="versions"></footer>
<script src="app.js"></script>
</body></html>
