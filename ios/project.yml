name: ParakeetKaraoke
options:
  bundleIdPrefix: com.wilddolphin
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "7"
targets:
  ParakeetKaraoke:
    type: application
    platform: iOS
    sources: [ParakeetKaraoke/Sources, ParakeetKaraoke/Assets.xcassets]
    settings:
      base:
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_BUNDLE_IDENTIFIER: com.wilddolphin.parakeetkaraoke
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: ParakeetKaraoke/Info.plist
      properties:
        CFBundleDisplayName: Live Karaoke
        LKDefaultServer: $(LK_DEFAULT_SERVER)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: Karaoke talks to your Parakeet server on the local network to transcribe songs and remove vocals.
        NSMicrophoneUsageDescription: Live Karaoke uses the microphone only when you record yourself singing along. Recordings stay on your device.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.wilddolphin.parakeetkaraoke
            CFBundleURLSchemes: [parakeetkaraoke]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    scheme:
      testTargets: [ParakeetKaraokeTests, ParakeetKaraokeUITests]

  ParakeetKaraokeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ParakeetKaraokeUITests]
    dependencies:
      - target: ParakeetKaraoke
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.wilddolphin.parakeetkaraoke.uitests

  ParakeetKaraokeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ParakeetKaraokeTests]
    dependencies:
      - target: ParakeetKaraoke
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.wilddolphin.parakeetkaraoke.tests
