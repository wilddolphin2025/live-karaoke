name: ParakeetKaraoke
options:
  bundleIdPrefix: com.wilddolphin
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: PPZTNTHDFC
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ParakeetKaraoke:
    type: application
    platform: iOS
    sources: [ParakeetKaraoke/Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wilddolphin.parakeetkaraoke
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: ParakeetKaraoke/Info.plist
      properties:
        CFBundleDisplayName: Karaoke
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: Karaoke talks to your Parakeet server on the local network to transcribe songs and remove vocals.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.wilddolphin.parakeetkaraoke
            CFBundleURLSchemes: [parakeetkaraoke]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
